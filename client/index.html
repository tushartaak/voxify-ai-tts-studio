<!doctype html>
<html lang="en" class="h-full bg-navy-950 text-slate-100 antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxify – AI Text-to-Speech Studio</title>
    <meta name="description" content="Convert written text into natural-sounding speech with flexible language, voice, and audio options." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Single Page App Redirect Restoration for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="h-full min-h-screen bg-navy-950 text-slate-100 selection:bg-brand-500 selection:text-white">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
